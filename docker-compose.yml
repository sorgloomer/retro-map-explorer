# Builds the whole application (the WebAssembly module with Emscripten and Box3D, the page with TypeScript and the bundler) in a container,
# into ./dist. Nothing is mounted from the host (a network drive cannot be): the sources go to the builder with the build context and the
# output comes back with the build's output, so the build is run with buildx bake, which reads this file:
#
#   docker buildx bake                                  the optimised build, into ./dist
#   FLAGS=--debug docker buildx bake                    the debug build
#
# The first run fetches Emscripten (a few hundred MB), Box3D and the Node packages into the builder's cache; the next ones find them there
# and compile only what changed. `docker builder prune` forgets the cache (and so all that).
# Without bake:  docker build -f scripts/build/Dockerfile --target dist --output dist [--build-arg FLAGS=--debug] .
name: retro-map-explorer

services:
  build:
    build:
      context: .
      dockerfile: scripts/build/Dockerfile
      target: dist
      args:
        FLAGS: ${FLAGS:-}
      x-bake:
        output: type=local,dest=./dist
