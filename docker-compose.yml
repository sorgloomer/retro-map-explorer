# Dev server behind an nginx reverse proxy.
#
#   node scripts/build.mjs        # once, on the host: builds dist/ (needs the local emsdk)
#   docker compose up -d
#
# Open http://localhost:58080/#secret=<secret> once: the app keeps the secret (the password of the encrypted zip
# archives in ./assets) in localStorage, reads the archives with range requests and decrypts them in the browser.
services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "scripts/serve.mjs", "8080"]
    volumes:
      - ./:/app:ro    # dist/, assets/ and scripts/ are read from the project
    expose:
      - "8080"
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "58080:58080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dev
    restart: unless-stopped
