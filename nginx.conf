# Plain HTTP reverse proxy in front of the dev server (see docker-compose.yml).
server {
    listen 58080;
    server_name _;

    location / {
        proxy_pass http://dev:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";

        # The asset archives are served as 4 MiB part files: stream them instead of buffering to disk.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
